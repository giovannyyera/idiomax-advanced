<header class="main-header">
  <div class="logo">
    <img src="Simb.png" alt="Logo Idiomax" class="logo-img" />

    <span class="logo-text">
      <span class="text-blue">I</span>
      <span class="text-red">DI</span>
      <span class="text-green">O</span>
      <span class="text-gold">M</span>
      <span class="text-blue">A</span>
      <span class="text-red">X</span>
    </span>
  </div>

  <div class="header-title">Painel Administrativo</div>

  <button type="button" class="btn-header" (click)="voltar()">Voltar</button>
</header>

<main class="admin-page">
  <section class="admin-card">
    <div class="admin-heading">
      <span class="admin-icon">⚙️</span>

      <h1>Gerenciar Conteúdo</h1>

      <p>Escolha abaixo o tipo de conteúdo que deseja cadastrar.</p>
    </div>

    <div class="admin-options">
      <button type="button" class="option-card idioma" (click)="irParaIdioma()">
        <span class="option-icon">🌎</span>

        <span class="option-content">
          <strong>Cadastrar Idioma</strong>
          <small>Adicione um novo idioma à plataforma</small>
        </span>

        <span class="option-arrow">→</span>
      </button>

      <button type="button" class="option-card licao" (click)="irParaLicao()">
        <span class="option-icon">📚</span>

        <span class="option-content">
          <strong>Cadastrar Lição</strong>
          <small>Crie novas lições para os idiomas</small>
        </span>

        <span class="option-arrow">→</span>
      </button>

      <button type="button" class="option-card exercicio" (click)="irParaExercicio()">
        <span class="option-icon">✏️</span>

        <span class="option-content">
          <strong>Cadastrar Exercício</strong>
          <small>Cadastre atividades e alternativas</small>
        </span>

        <span class="option-arrow">→</span>
      </button>
    </div>

    <div class="admin-footer">
      <button type="button" class="btn-back" (click)="voltar()">← Voltar para o painel</button>
    </div>
  </section>
</main>
