<div class="page-container">
  <div class="card">
    
    <div *ngIf="carregando" class="state-container">
      <div class="spinner"></div>
      <p class="loading-text">Verificando certificado...</p>
    </div>

    <div *ngIf="mensagem && !carregando" class="alert-box">
      <p>{{ mensagem }}</p>
    </div>

    <div *ngIf="certificado && !carregando" class="certificate-content">
      <div class="badge-icon">🏆</div>
      <h1 class="title">Parabéns, {{ certificado.nome }}!</h1>
      <p class="subtitle">Seu certificado está pronto para download.</p>

      <div class="info-grid">
        <div class="info-item">
          <span class="label">Idioma</span>
          <span class="value">{{ certificado.idioma }}</span>
        </div>
        <div class="info-item">
          <span class="label">Nível Concluído</span>
          <span class="value">{{ certificado.nivel_concluido }}</span>
        </div>
        <div class="info-item">
          <span class="label">Pontuação Total</span>
          <span class="value highlight">{{ certificado.pontuacao_total }}</span>
        </div>
      </div>

      <button type="button" class="btn btn-primary" (click)="abrirPdf()">
        📄 Abrir certificado em PDF
      </button>
    </div>

    <div class="card-footer">
      <button type="button" class="btn btn-secondary" (click)="voltar()">
        ← Voltar
      </button>
    </div>

  </div>
</div>
