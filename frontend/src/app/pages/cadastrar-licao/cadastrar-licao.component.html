<header class="main-header">
  <div class="logo">
    <img src="Simb.png" alt="Logo Idiomax" class="logo-img" />

    <span class="logo-text">
      <span class="text-blue">I</span>
      <span class="text-red">DI</span>
      <span class="text-green">O</span>
      <span class="text-gold">M</span>
      <span class="text-blue">A</span>
      <span class="text-red">X</span>
    </span>
  </div>

  <div class="header-title">Administração</div>

  <button type="button" class="btn-header" (click)="voltar()">Voltar</button>
</header>

<main class="cadastro-page">
  <section class="cadastro-card">
    <div class="cadastro-heading">
      <span class="cadastro-icon">📚</span>

      <h1>Cadastrar Lição</h1>

      <p>Adicione uma nova lição vinculada a um idioma.</p>
    </div>

    <div class="form-group">
      <label for="idioma"> Idioma </label>

      <select id="idioma" [(ngModel)]="codigoIdioma">
        <option [ngValue]="null">Selecione um idioma</option>

        <option *ngFor="let idioma of idiomas" [ngValue]="idioma.codigo">
          {{ idioma.codigo }} - {{ idioma.descricao }}
        </option>
      </select>
    </div>

    <div class="nivel-box">
      <div>
        <span class="nivel-label"> Total de níveis </span>

        <strong>3 níveis</strong>
      </div>

      <span class="nivel-icon"> 🎯 </span>
    </div>

    <button type="button" class="btn-cadastrar" (click)="cadastrar()" [disabled]="carregando">
      {{ carregando ? 'Cadastrando...' : 'Cadastrar lição' }}
    </button>

    <div *ngIf="mensagem" class="feedback" [class.success]="sucesso" [class.error]="!sucesso">
      {{ mensagem }}
    </div>

    <div class="cadastro-footer">
      <button type="button" class="btn-voltar" (click)="voltar()">
        ← Voltar para gerenciamento
      </button>
    </div>
  </section>
</main>
