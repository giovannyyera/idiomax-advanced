<div>
  <h1>Criar cadastro</h1>

  <label>
    Nome
  </label>

  <input
    type="text"
    [(ngModel)]="nome"
    placeholder="Digite seu nome"
  >

  <br><br>

  <label>
    Idioma
  </label>

  <select [(ngModel)]="codigoIdioma">
    <option
      [ngValue]="null"
    >
      Selecione um idioma
    </option>

    <option
      *ngFor="let idioma of idiomas"
      [ngValue]="idioma.codigo"
    >
      {{ idioma.descricao }}
    </option>
  </select>

  <br><br>

  <button
    type="button"
    (click)="cadastrar()"
    [disabled]="carregando"
  >
    {{ carregando ? 'Cadastrando...' : 'Cadastrar' }}
  </button>

  <p *ngIf="mensagem">
    {{ mensagem }}
  </p>
</div>
